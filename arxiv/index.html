<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.3, shrink-to-fit=no">
    <link rel="manifest" href="../manifest.json">
    <title>Müştəri arxivi</title>
    <link rel="stylesheet" href="../style.css?v=6.3">
    <link rel="stylesheet" href="arxiv.css?v=6.3">
     <link rel="icon" type="image/png" href="../favicon.png?v=1">
   <link rel="shortcut icon" type="image/png" href="../favicon.png?v=1">
    <!-- Təqvim üçün stili bura qoyuruq -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
</head>
<body>

<div class="archive-container">
    <div class="archive-header-row" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
        <a href="../index.html" class="nav-btn">← Əsas Səhifəyə Qayıt</a>
        <div class="document-title" style="color: #5bc0be; font-size: 22px; font-weight: 700; flex-grow: 1; text-align: center;">
            Müştəri Arxivi
        </div>
        <!-- Ölçü tarazlığı üçün görünməz boşluq (başlığı tam mərkəzdə saxlayır) -->
        <div style="width: 150px;"></div>
    </div>

    <!-- Filtrləmə Sahəsi -->
    <div class="filter-panel">
        <div class="filter-group">
            <label>Başlanğıc Tarix:</label>
            <input type="text" id="start-date" placeholder="Seçin...">
        </div>
        <div class="filter-group">
            <label>Bitmə Tarix:</label>
            <input type="text" id="end-date" placeholder="Seçin...">
        </div>
        <div class="filter-buttons">
           <button id="btn-clear">Təmizlə</button>
           <button id="btn-bulk-delete" class="btn-danger">Sil</button>
        </div>
    </div>

    <!-- Ayrı Axtarış Paneli -->
    <div class="search-panel-box" style="margin-bottom: 20px;">
        <input type="text" id="archive-search-input" class="archive-search-input" placeholder="Müştəri adına görə axtar...">
    </div>

    <!-- Yeni Sadələşdirilmiş Arxiv Cədvəli -->
    <div class="invoice-box">
        <div class="invoice-table-wrapper">
            <table class="invoice-table" id="archive-table">
                <thead>
                    <tr>
                        <th>Tarix / Saat</th>
                        <th>Müştəri Adı</th>
                        <th style="text-align: right;">Məbləğ</th>
                        <th style="text-align: center; width: 220px;">Əməliyyatlar</th>
                    </tr>
                </thead>
                <tbody id="archive-tbody">
                    <!-- JS tərəfindən doldurulacaq -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Təqvim və PDF skriptləri -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/az.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script type="module" src="./arxiv.js?v=6.3"></script>
</body>
</html>

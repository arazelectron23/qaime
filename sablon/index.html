<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Şablon</title>
    <link rel="icon" type="image/png" href="../favicon.png?v=1">
    <link rel="stylesheet" href="./sablon.css?v=6.2">
</head>
<body>
    <div class="container">
        <div class="header-section">
            <a href="../index.html" class="btn-back">← Geri qayıt</a>
            <h2>Şablonlar</h2>
        </div>
        
        <!-- Şablon Əlavə Etmə Formu -->
        <div class="form-card" style="flex-direction: column; align-items: stretch; gap: 15px;">
            <input type="text" id="tpl-name" placeholder="Şablonun adı (məs: Standart Quraşdırma)">
            
           <div style="background: #0b0f19; padding: 10px; border-radius: 6px; border: 1px solid #1f2937;">
                <label style="font-size: 13px; color: #9ca3af; display: block; margin-bottom: 8px;">Məhsulları seçin:</label>
                <!-- Axtarış inputu əlavə olundu -->
                <input type="text" id="product-search-input" placeholder="Məhsul axtar..." style="width: 100%; margin-bottom: 8px; box-sizing: border-box;">
                <div id="product-select-container" style="max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;">
                    <!-- Firebase-dən gələn məhsullar bura gələcək -->
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end;">
                <button id="btn-open-modal" class="btn-back">Şablon Əlavə Et</button>
            </div>
        </div>

        <div class="search-card">
            <input type="text" id="tpl-search" placeholder="Şablon axtar...">
        </div>

        <!-- Şablonların Cədvəli -->
        <table class="prod-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Şablon Adı</th>
                    <th>Məhsullar və Sayı</th>
                    <th>Ümumi Qiymət</th>
                    <th>Əməliyyat</th>
                </tr>
            </thead>
            <tbody id="tpl-tbody">
                <!-- Şablonlar bura gələcək -->
            </tbody>
        </table>
    </div>

   <!-- Sayların Daxil Edilməsi və Təsdiq Modalı -->
    <div id="qty-modal" style="display: none;" class="modal-overlay-custom">
        <div class="modal-box-premium">
            <div class="modal-header-premium">
                <h3 id="modal-title">Seçilmiş Məhsulların Sayı</h3>
                <span class="modal-badge-info">Say Tənzimləməsi</span>
            </div>
            
            <div class="modal-subtitle">Zəhmət olmasa məhsulların miqdarını qeyd edin:</div>
            
            <div id="modal-qty-container" class="modal-scroll-list">
                <!-- Seçilən məhsullar və say inputları bura düşəcək -->
            </div>

            <!-- Ümumi qiymət hissəsi -->
            <div class="modal-total-wrapper">
                <span>Ümumi Qiymət:</span>
                <div>
                    <span id="modal-calculated-total">0.00</span> 
                    <span style="font-size: 13px; color: #5bc0be;">AZN</span>
                </div>
            </div>

            <div class="modal-footer-buttons">
                <button id="modal-btn-cancel" class="btn-modal-cancel">Ləğv et</button>
                <button id="modal-btn-save" class="btn-modal-save">Yadda Saxla</button>
            </div>
        </div>
    </div>

    <script type="module" src="./sablon.js?v=6.2"></script>
</body>
</html>
